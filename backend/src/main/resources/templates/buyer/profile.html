<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Buyer Profile')}"></head>
<body>
  <div th:replace="~{fragments/header :: navbar}"></div>

  <main class="main-content">
    <div class="container" style="max-width: 680px;">
      
      <div class="page-header">
        <div>
          <h1 class="page-title">Personal <span class="gold-text">Profile</span></h1>
          <p style="color: var(--color-light-pink); font-size: 0.95rem;">Manage your delivery addresses and contact information</p>
        </div>
        <a th:href="@{/buyer/dashboard}" class="btn btn-outline-pink btn-sm">&larr; Back to Dashboard</a>
      </div>

      <div th:if="${successMessage != null}" class="alert alert-success">
        <span th:text="${successMessage}">Profile updated!</span>
      </div>

      <div class="dm-card" style="padding: 2.5rem;">
        <form th:action="@{/buyer/profile}" method="POST">
          <div class="form-group">
            <label class="form-label" for="email">Account Email (Immutable)</label>
            <input type="email" id="email" class="form-input" th:value="${user.email}" readonly style="opacity: 0.7; cursor: not-allowed;">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="fullName">Full Name</label>
              <input type="text" id="fullName" name="fullName" th:value="${user.fullName}" required class="form-input">
            </div>

            <div class="form-group">
              <label class="form-label" for="phone">Phone Number</label>
              <input type="text" id="phone" name="phone" th:value="${user.phone}" required class="form-input">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="shippingAddress">Default Street Shipping Address</label>
            <textarea id="shippingAddress" name="shippingAddress" rows="3" class="form-textarea"
                      th:text="${buyer != null ? buyer.shippingAddress : ''}"></textarea>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="city">City</label>
              <input type="text" id="city" name="city" th:value="${buyer != null ? buyer.city : ''}" class="form-input">
            </div>

            <div class="form-group">
              <label class="form-label" for="postalCode">Postal Code</label>
              <input type="text" id="postalCode" name="postalCode" th:value="${buyer != null ? buyer.postalCode : ''}" class="form-input">
            </div>
          </div>

          <button type="submit" class="btn btn-gold btn-lg" style="width: 100%; margin-top: 1rem;">
            Save Profile Changes
          </button>
        </form>
      </div>

    </div>
  </main>

  <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
