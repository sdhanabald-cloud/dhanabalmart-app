<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Seller Center Sign In')}"></head>
<body>
  <div th:replace="~{fragments/header :: navbar}"></div>

  <main class="main-content">
    <div class="container" style="max-width: 480px;">
      
      <div class="dm-card" style="padding: 2.5rem;">
        <div style="text-align: center; margin-bottom: 2rem;">
          <div style="font-size: 3rem; margin-bottom: 0.5rem; color: var(--color-gold);">&#127978;</div>
          <h1 style="font-size: 1.8rem; color: #FFFFFF;">Seller <span class="gold-text">Center</span></h1>
          <p style="color: var(--color-light-pink); font-size: 0.88rem; margin-top: 0.25rem;">
            Sign in to manage inventory, catalog listings, and order fulfillment
          </p>
        </div>

        <div th:if="${message != null}" class="alert alert-success">
          <span th:text="${message}">Success message</span>
        </div>

        <div th:if="${error != null}" class="alert alert-danger">
          <span th:text="${error}">Error message</span>
        </div>

        <form th:action="@{/login/seller}" method="POST">
          <div class="form-group">
            <label class="form-label" for="email">Seller Email Address</label>
            <input type="email" id="email" name="email" th:value="${email != null ? email : 'seller1@dhanabalmart.com'}" required class="form-input">
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" name="password" value="Seller@123" required class="form-input">
          </div>

          <button type="submit" class="btn btn-brown" style="width: 100%; margin-top: 1rem; padding: 0.8rem;">
            Access Seller Center
          </button>
        </form>

        <div style="margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid rgba(232,201,207,0.15); text-align: center; font-size: 0.85rem;">
          <p style="color: #cbd5e1; margin-bottom: 0.5rem;">Don't have a merchant store?</p>
          <a th:href="@{/register/seller}" class="btn btn-outline-pink btn-sm">Register As Merchant</a>
        </div>
      </div>

    </div>
  </main>

  <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
