<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Register Merchant Store')}"></head>
<body>
  <div th:replace="~{fragments/header :: navbar}"></div>

  <main class="main-content">
    <div class="container" style="max-width: 580px;">
      
      <div class="dm-card" style="padding: 2.5rem;">
        <div style="text-align: center; margin-bottom: 2rem;">
          <div style="font-size: 3rem; margin-bottom: 0.5rem; color: var(--color-gold);">&#127978;</div>
          <h1 style="font-size: 1.8rem; color: #FFFFFF;">Become a <span class="gold-text">Seller</span></h1>
          <p style="color: var(--color-light-pink); font-size: 0.88rem; margin-top: 0.25rem;">
            List your merchandise to thousands of premium shoppers on DhanabalMart
          </p>
        </div>

        <div th:if="${error != null}" class="alert alert-danger">
          <span th:text="${error}">Error message</span>
        </div>

        <form th:action="@{/register/seller}" method="POST">
          <div class="form-group">
            <label class="form-label" for="fullName">Owner Full Name</label>
            <input type="text" id="fullName" name="fullName" placeholder="e.g. Ramesh Kumar" required class="form-input">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="email">Business Email</label>
              <input type="email" id="email" name="email" placeholder="merchant@domain.com" required class="form-input">
            </div>

            <div class="form-group">
              <label class="form-label" for="phone">Contact Phone</label>
              <input type="text" id="phone" name="phone" placeholder="+1-555-0199" required class="form-input">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="storeName">Store / Brand Name</label>
            <input type="text" id="storeName" name="storeName" placeholder="e.g. Royal Jewels Boutique" required class="form-input">
          </div>

          <div class="form-group">
            <label class="form-label" for="businessAddress">Business Headquarters Address</label>
            <input type="text" id="businessAddress" name="businessAddress" placeholder="100 Luxury Blvd, Suite 400" class="form-input">
          </div>

          <div class="form-group">
            <label class="form-label" for="taxId">Tax / GST Identification Number</label>
            <input type="text" id="taxId" name="taxId" placeholder="TAX-77889900" class="form-input">
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Account Password</label>
            <input type="password" id="password" name="password" placeholder="Minimum 6 characters" required class="form-input">
          </div>

          <button type="submit" class="btn btn-gold" style="width: 100%; margin-top: 1rem; padding: 0.85rem;">
            Submit Merchant Application
          </button>
        </form>

        <div style="margin-top: 1.75rem; text-align: center; font-size: 0.85rem;">
          <a th:href="@{/login/seller}" style="color: var(--color-light-pink);">Already registered? Sign in here &rarr;</a>
        </div>
      </div>

    </div>
  </main>

  <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
