<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Administrator Profile')}"></head>
<body>
  <div th:replace="~{fragments/header :: navbar}"></div>

  <main class="main-content">
    <div class="container" style="max-width: 650px;">
      
      <div class="page-header">
        <div>
          <h1 class="page-title">Administrator <span class="gold-text">Profile</span></h1>
          <p style="color: var(--color-light-pink); font-size: 0.95rem;">System operator identity and security credentials</p>
        </div>
        <a th:href="@{/admin/dashboard}" class="btn btn-outline-pink btn-sm">&larr; Back to Dashboard</a>
      </div>

      <div class="dm-card" style="padding: 2.5rem;">
        <div style="text-align: center; margin-bottom: 2rem;">
          <div style="font-size: 3.5rem; margin-bottom: 0.5rem; color: var(--color-gold);">&#128081;</div>
          <h2 style="font-size: 1.5rem; color: #FFF;" th:text="${user.fullName}">Admin Name</h2>
          <span class="badge badge-gold">Platform Super Administrator</span>
        </div>

        <div style="background: var(--color-peacock-dark); padding: 1.5rem; border-radius: 8px; margin-bottom: 1.5rem;">
          <div style="display: flex; justify-content: space-between; margin-bottom: 0.75rem; color: #cbd5e1; font-size: 0.92rem;">
            <span>Operator Email:</span>
            <strong style="color: #FFF;" th:text="${user.email}">admin@dhanabalmart.com</strong>
          </div>
          <div style="display: flex; justify-content: space-between; margin-bottom: 0.75rem; color: #cbd5e1; font-size: 0.92rem;">
            <span>Phone Contact:</span>
            <span style="color: #FFF;" th:text="${user.phone}">+1-800-DHANABAL</span>
          </div>
          <div style="display: flex; justify-content: space-between; margin-bottom: 0.75rem; color: #cbd5e1; font-size: 0.92rem;">
            <span>System Role:</span>
            <span class="badge badge-gold" th:text="${user.role}">ROLE_ADMIN</span>
          </div>
          <div style="display: flex; justify-content: space-between; color: #cbd5e1; font-size: 0.92rem;">
            <span>Account Standing:</span>
            <span class="badge badge-olive" th:text="${user.status}">ACTIVE</span>
          </div>
        </div>

        <div style="text-align: center;">
          <a th:href="@{/logout}" class="btn btn-danger" style="width: 100%;">Sign Out of Admin Terminal</a>
        </div>
      </div>

    </div>
  </main>

  <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
