<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head(${isEdit ? 'Edit Product' : 'Add New Product'})}"></head>
<body>
  <div th:replace="~{fragments/header :: navbar}"></div>

  <main class="main-content">
    <div class="container" style="max-width: 680px;">
      
      <div class="page-header">
        <div>
          <h1 class="page-title">
            <span th:text="${isEdit ? 'Edit' : 'Add New'}">Add New</span>
            <span class="gold-text">Product</span>
          </h1>
          <p style="color: var(--color-light-pink); font-size: 0.95rem;">Configure specifications, pricing, and inventory</p>
        </div>
        <a th:href="@{/seller/products}" class="btn btn-outline-pink btn-sm">&larr; Back to Products</a>
      </div>

      <div th:if="${errorMessage != null}" class="alert alert-danger">
        <span th:text="${errorMessage}">Error occurred</span>
      </div>

      <div class="dm-card" style="padding: 2.5rem;">
        <form th:action="${isEdit ? '/seller/products/edit/' + productId : '/seller/products/new'}" method="POST">
          
          <div class="form-group">
            <label class="form-label" for="name">Product Name *</label>
            <input type="text" id="name" name="name" th:value="${product.name}" required class="form-input" placeholder="e.g. Royal Chronometer Watch">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="categoryId">Category *</label>
              <select id="categoryId" name="categoryId" required class="form-select">
                <option value="">Select Category</option>
                <option th:each="cat : ${categories}"
                        th:value="${cat.id}"
                        th:text="${cat.name}"
                        th:selected="${product.categoryId != null && product.categoryId == cat.id}">
                  Category
                </option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="status">Catalog Status</label>
              <select id="status" name="status" class="form-select">
                <option value="ACTIVE" th:selected="${product.status == 'ACTIVE'}">ACTIVE (Visible in Store)</option>
                <option value="INACTIVE" th:selected="${product.status == 'INACTIVE'}">INACTIVE (Hidden)</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="price">Price (USD $) *</label>
              <input type="number" step="0.01" min="0.01" id="price" name="price" th:value="${product.price}" required class="form-input" placeholder="299.99">
            </div>

            <div class="form-group">
              <label class="form-label" for="stockQuantity">Stock Available *</label>
              <input type="number" min="0" id="stockQuantity" name="stockQuantity" th:value="${product.stockQuantity != null ? product.stockQuantity : 10}" required class="form-input" placeholder="50">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="imageUrl">Product Image URL</label>
            <input type="url" id="imageUrl" name="imageUrl" th:value="${product.imageUrl}" class="form-input" placeholder="https://images.unsplash.com/photo-...">
          </div>

          <div class="form-group">
            <label class="form-label" for="description">Detailed Description</label>
            <textarea id="description" name="description" rows="4" class="form-textarea" placeholder="Detailed artisanal specifications, craftsmanship, materials, warranty..." th:text="${product.description}"></textarea>
          </div>

          <button type="submit" class="btn btn-gold btn-lg" style="width: 100%; margin-top: 1rem;">
            <span th:text="${isEdit ? 'Update Product Information' : 'Publish Product to Marketplace'}">Publish</span>
          </button>
        </form>
      </div>

    </div>
  </main>

  <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
