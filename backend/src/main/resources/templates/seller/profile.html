<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Seller Store Profile')}"></head>
<body>
  <div th:replace="~{fragments/header :: navbar}"></div>

  <main class="main-content">
    <div class="container" style="max-width: 680px;">
      
      <div class="page-header">
        <div>
          <h1 class="page-title">Storefront <span class="gold-text">Settings</span></h1>
          <p style="color: var(--color-light-pink); font-size: 0.95rem;">Configure your commercial business details and credentials</p>
        </div>
        <a th:href="@{/seller/dashboard}" class="btn btn-outline-pink btn-sm">&larr; Back to Dashboard</a>
      </div>

      <div th:if="${successMessage != null}" class="alert alert-success">
        <span th:text="${successMessage}">Profile updated!</span>
      </div>

      <div class="dm-card" style="padding: 2.5rem;">
        <form th:action="@{/seller/profile}" method="POST">
          <div class="form-group">
            <label class="form-label" for="email">Account Email (Immutable)</label>
            <input type="email" id="email" class="form-input" th:value="${user.email}" readonly style="opacity: 0.7; cursor: not-allowed;">
          </div>

          <div class="form-group">
            <label class="form-label" for="storeName">Official Store / Brand Name *</label>
            <input type="text" id="storeName" name="storeName" th:value="${seller != null ? seller.storeName : ''}" required class="form-input">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="phone">Business Phone *</label>
              <input type="text" id="phone" name="phone" th:value="${user.phone}" required class="form-input">
            </div>

            <div class="form-group">
              <label class="form-label" for="taxId">Tax / GST Number</label>
              <input type="text" id="taxId" name="taxId" th:value="${seller != null ? seller.taxId : ''}" class="form-input">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="businessAddress">Store Dispatch / Headquarters Address</label>
            <textarea id="businessAddress" name="businessAddress" rows="3" class="form-textarea" th:text="${seller != null ? seller.businessAddress : ''}"></textarea>
          </div>

          <div class="form-group">
            <label class="form-label">Approval Standing</label>
            <div>
              <span class="badge badge-olive" th:text="${seller != null ? seller.approvalStatus : 'APPROVED'}">APPROVED</span>
            </div>
          </div>

          <button type="submit" class="btn btn-gold btn-lg" style="width: 100%; margin-top: 1rem;">
            Save Store Configuration
          </button>
        </form>
      </div>

    </div>
  </main>

  <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
