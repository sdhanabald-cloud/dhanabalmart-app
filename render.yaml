databases:
  - name: dhanabalmart-db
    databaseName: dhanabalmart
    user: dhanabal_user
    plan: free

services:
  - type: web
    name: dhanabal-mart
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: dhanabalmart-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
